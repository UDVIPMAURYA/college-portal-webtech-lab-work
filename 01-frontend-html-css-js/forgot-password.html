<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ABC Institute</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-spinner">Loading...</div>

    <div id="header-placeholder"></div>

    <div class="content">
        <h2>Reset Password</h2>
        <form id="forgot-password-form" class="form-card">

            <!-- Step 1: Enter email to verify account exists -->
            <div id="step-email">
                <div class="form-group">
                    <label for="resetEmail">Enter your registered email:</label>
                    <input type="email" id="resetEmail" name="resetEmail" required>
                </div>
                <p id="email-message" class="form-message"></p>
                <button type="submit" id="verify-email-btn">Verify Email</button>
            </div>

            <!-- Step 2: Shown only after email is verified -->
            <div id="step-new-password" class="hidden">
                <div class="form-group">
                    <label for="newPassword">New Password:</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                <p id="reset-message" class="form-message"></p>
                <button type="submit">Reset Password</button>
            </div>

            <p class="form-footer-link">Remembered your password? <a href="login.html">Login here</a></p>

        </form>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/include.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
