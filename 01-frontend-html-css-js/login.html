<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ABC Institute</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-spinner">Loading...</div>

    <div id="header-placeholder"></div>

    <div class="content">
        <h2>Login</h2>
        <form id="login-form" class="form-card">

            <div class="form-group">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" name="loginEmail" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="loginPassword" required>
            </div>

            <p id="login-message" class="form-message"></p>

            <button type="submit">Login</button>

            <p class="form-footer-link">Don't have an account? <a href="signup.html">Sign up here</a></p>
            <p class="form-footer-link"><a href="forgot-password.html">Forgot Password?</a></p>

        </form>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/include.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
