<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - ABC Institute</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-spinner">Loading...</div>

    <div id="header-placeholder"></div>

    <div class="content">
        <h2>Registration Form</h2>
        <form id="registration-form" class="form-card">

            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="registerAs">Register As:</label>
                <select id="registerAs" name="registerAs">
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                    <option value="staff">Staff</option>
                </select>
            </div>

            <div class="form-group">
                <label for="department">Department:</label>
                <select id="department" name="department">
                    <option value="cse">Computer Science & Engineering</option>
                    <option value="it">Information Technology</option>
                    <option value="ece">Electronics & Communication</option>
                </select>
            </div>

            <!-- Shown only when "Student" is selected -->
            <div id="student-fields" class="form-group">
                <label for="course">Course:</label>
                <select id="course" name="course">
                    <option value="btech">B.Tech</option>
                    <option value="mtech">M.Tech</option>
                    <option value="diploma">Diploma</option>
                </select>
            </div>

            <!-- Shown only when "Faculty" or "Staff" is selected -->
            <div id="staff-fields" class="form-group hidden">
                <label for="designation">Designation:</label>
                <input type="text" id="designation" name="designation">
            </div>

            <button type="submit">Register</button>
        </form>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/include.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/form.js"></script>
</body>
</html>
