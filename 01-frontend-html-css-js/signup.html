<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ABC Institute</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-spinner">Loading...</div>

    <div id="header-placeholder"></div>

    <div class="content">
        <h2>Create Account</h2>
        <form id="signup-form" class="form-card" novalidate>

        <div class="form-group">
            <label for="signupName">Full Name:</label>
            <input type="text" id="signupName" name="signupName">
            <span class="field-error" id="signupName-error"></span>
        </div>

        <div class="form-group">
            <label for="signupEmail">Email:</label>
            <input type="email" id="signupEmail" name="signupEmail">
            <span class="field-error" id="signupEmail-error"></span>
        </div>

        <div class="form-group">
            <label for="signupPassword">Password:</label>
            <div class="password-wrapper">
                <input type="password" id="signupPassword" name="signupPassword">
                <button type="button" class="toggle-password" data-target="signupPassword">Show</button>
            </div>
            <span class="field-error" id="signupPassword-error"></span>
        </div>

        <p id="signup-message" class="form-message"></p>

        <button type="submit">Sign Up</button>

        <p class="form-footer-link">Already have an account? <a href="login.html">Login here</a></p>

    </form>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/include.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
